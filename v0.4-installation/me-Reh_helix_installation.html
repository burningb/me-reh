<style>
/* 전시 화면: 3D 무대가 전부이고, 글씨는 모서리에 작게 */
:root{
  --bg:#0a0a0a; --fg:#f0f0ec; --dim:rgba(240,240,236,.58); --line:rgba(240,240,236,.22); --panel:rgba(10,10,10,.82);

}
:root.inv{--bg:#f2f2ee; --fg:#111110; --dim:rgba(17,17,16,.6); --line:rgba(17,17,16,.22); --panel:rgba(242,242,238,.88); color-scheme:light}

  padding:22px 26px;min-width:min(520px,90vw);font:400 13px/1.9 var(--mono);display:grid;gap:4px}

<body>
<canvas id="gl" aria-hidden="true"></canvas>

  <h2>조작 (전시 운영자용)</h2>

<script src="vendor/three.min.js"></script>
<script>
'use strict';
/* =========================================================================
   미래 me-Reh v0.4 — 목소리 나선 (설치 버전)
   마이크 → 음량·음높이 프레임 → 발화마다 로컬 Whisper → 단어별 시간
   → 나선 위에 선으로 된 글자로 쌓임. 1번으로 기록을 시작하고 2번으로 끝내 저장함.
   ========================================================================= */
const Q=new URLSearchParams(location.search);
const CFG={
  idle:+Q.get('idle')||0,           // 0이 아니면: 이 시간(초) 동안 말이 없을 때 자동으로 끝내고 저장
  auto:Q.get('auto')==='1'||Q.get('demo')==='1', // 1이면 1번 없이 목소리가 들리면 바로 기록 시작
  maxSess:+Q.get('max')||600,       // 세션 최대 길이(초)
  lang:Q.get('lang')||'ko',         // 인식 언어 ko / en / ja
  invert:Q.get('invert')==='1',     // 흰 바탕
  data:Q.get('data')!=='0',         // 수치·측정선
  demo:Q.get('demo')==='1',         // 마이크 없이 예시 대사로 돌림
  loop:Q.get('loop')!=='0',         // 데모 반복
};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>performance.now()/1000;
const SANS="'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif";
const MONO="'SF Mono',Menlo,'IBM Plex Mono','DejaVu Sans Mono',monospace";
const dB=v=>Math.round(40+v*36);
const fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60);return `${String(m).padStart(2,'0')}:${(s-m*60).toFixed(1).padStart(4,'0')}`;};

/* =========================================================================
   1. 음향 분석 (v0.3과 같은 방식)
   ========================================================================= */
let frames=[];
function pushFrame(f){frames.push(f);if(frames.length>12000)frames.splice(0,frames.length-10000);}
function framesIn(t0,t1){const o=[];for(let i=frames.length-1;i>=0;i--){const f=frames[i];if(f.t<t0)break;if(f.t<=t1)o.push(f);}return o.reverse();}
// 음량 자동 보정: 바닥 = 최근 8초 하위 10%, 천장 = 최근 30초 말소리 상위 5%
const lv={floor:-60,peak:-30,hist:new Float32Array(480),hi:0,hn:0,voiced:new Float32Array(1800),vi:0,vn:0,tick:0,db:-90};
function updateLevels(db){
  lv.db=db;lv.hist[lv.hi]=db;lv.hi=(lv.hi+1)%lv.hist.length;lv.hn=Math.min(lv.hn+1,lv.hist.length);
  if(db>lv.floor+8){lv.voiced[lv.vi]=db;lv.vi=(lv.vi+1)%lv.voiced.length;lv.vn=Math.min(lv.vn+1,lv.voiced.length);}
  if(++lv.tick%10===0){
    const h=Array.from(lv.hist.subarray(0,lv.hn)).sort((a,b)=>a-b);if(h.length>20)lv.floor=h[Math.floor(h.length*.1)];
    if(lv.vn>45){const v=Array.from(lv.voiced.subarray(0,lv.vn)).sort((a,b)=>a-b);lv.peak=v[Math.floor(v.length*.95)];}
    else lv.peak=Math.max(lv.peak,lv.floor+28);
    lv.peak=Math.max(lv.peak,lv.floor+14);
  }
}
const volOf=db=>{const lo=Math.max(lv.floor+5,lv.peak-26),range=Math.max(9,lv.peak-lo);return clamp((db-lo)/range,0,1);};
function detectPitch(b,sr){
  const n=b.length>>1,d=new Float32Array(n);for(let i=0;i<n;i++)d[i]=(b[2*i]+b[2*i+1])*.5;
  const s2=sr/2,minL=Math.floor(s2/500),maxL=Math.min(n-1,Math.floor(s2/70));
  let e=0;for(let i=0;i<n;i++)e+=d[i]*d[i];if(e<1e-6)return 0;
  const r=new Float32Array(maxL+2);let best=0;
  for(let L=minL;L<=maxL;L++){let s=0;for(let i=0;i<n-L;i++)s+=d[i]*d[i+L];r[L]=s/e;if(r[L]>best)best=r[L];}
  if(best<.45)return 0;
  for(let L=minL+1;L<maxL;L++)if(r[L]>=best*.88&&r[L]>=r[L-1]&&r[L]>=r[L+1]){const a=r[L-1],c=r[L+1],p=(a-c)/(2*(a-2*r[L]+c)||1);return s2/(L+(isFinite(p)?p:0));}
  return 0;
}
function statsOf(t0,t1){
  const fr=framesIn(t0,t1),vo=fr.filter(f=>f.v>.04),vs=vo.map(f=>f.v).sort((a,b)=>a-b);
  const vol=vs.length?vs[Math.min(vs.length-1,Math.floor(vs.length*.75))]:.05;
  const hs=vo.filter(f=>f.hz>0).map(f=>f.hz).sort((a,b)=>a-b);
  return{vol,hz:hs.length?hs[hs.length>>1]:0};
}
let lastHz=170;
function wordAt(w,a,b,sp){
  const st=statsOf(a,b),hz=st.hz||lastHz;if(st.hz)lastHz=st.hz;
  const chars=Array.from(w).filter(ch=>/[\p{L}\p{N}]/u.test(ch)),sy=chars.length?chars:[w];
  const syl=sy.map((ch,k)=>{const t0=a+(b-a)*k/sy.length,t1=a+(b-a)*(k+1)/sy.length,s=statsOf(t0,t1);return{ch,t0,t1,vol:s.vol,hz:s.hz||hz};});
  return{t:w,sp,a,b,vol:st.vol,hz,syl};
}

/* ---------- 마이크 ---------- */
let ac=null,an=null,tbuf=null,proc=null,pcm=[];
async function startMic(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended'){$('gate').hidden=false;await new Promise(r=>$('gate').addEventListener('click',r,{once:true}));$('gate').hidden=true;await ac.resume();}
  const src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=2048;src.connect(an);tbuf=new Float32Array(an.fftSize);
  // Whisper로 보낼 16kHz 원음 (최근 60초)
  proc=ac.createScriptProcessor(4096,1,1);const ratio=ac.sampleRate/16000;
  proc.onaudioprocess=e=>{const x=e.inputBuffer.getChannelData(0),n=Math.floor(x.length/ratio),out=new Float32Array(n);
    for(let i=0;i<n;i++){const a=Math.floor(i*ratio),b=Math.max(a+1,Math.floor((i+1)*ratio));let s=0;for(let k=a;k<b;k++)s+=x[k];out[i]=s/(b-a);}
    pcm.push({t:now()-x.length/ac.sampleRate,d:out});while(pcm.length&&pcm[0].t<now()-60)pcm.shift();};
  src.connect(proc);proc.connect(ac.destination);
}
function audioStep(){
  if(!an)return;an.getFloatTimeDomainData(tbuf);let s=0;for(const x of tbuf)s+=x*x;
  const db=20*Math.log10(Math.sqrt(s/tbuf.length)+1e-9);updateLevels(db);
  const v=volOf(db),f={t:now(),v,hz:v>.05?detectPitch(tbuf,ac.sampleRate):0};
  onFrame(f);if(ws&&ws.readyState===1&&((S.state==='active'&&!S.stopping)||CFG.auto||vad.on))vadStep(f);
}
function pcmBetween(t0,t1){
  const parts=[];let total=0;
  for(const c of pcm){const ct1=c.t+c.d.length/16000;if(ct1<t0||c.t>t1)continue;const a=Math.max(0,Math.floor((t0-c.t)*16000)),b=Math.min(c.d.length,Math.ceil((t1-c.t)*16000));if(b>a){parts.push(c.d.subarray(a,b));total+=b-a;}}
  const i16=new Int16Array(total);let o=0;for(const p of parts)for(let k=0;k<p.length;k++)i16[o++]=clamp(p[k],-1,1)*32767;
  const u8=new Uint8Array(i16.buffer);let bin='';for(let k=0;k<u8.length;k+=0x8000)bin+=String.fromCharCode.apply(null,u8.subarray(k,k+0x8000));return btoa(bin);
}

/* =========================================================================
   2. 로컬 Whisper 연결 (끊기면 계속 다시 연결)
   ========================================================================= */
let ws=null,wsInfo='';const utts={};let partialBusy=false;
const vad={on:false,t0:0,lastVoice:0,run:0,id:0,lastPartial:0,lastClose:0};
const awaiting=()=>Object.values(utts).some(u=>u.closed&&!u.done&&now()-u.sent<20);
function wsConnect(){
  if(CFG.demo)return;
  const url=location.protocol.startsWith('http')?`ws://${location.host}/ws`:'ws://localhost:8765/ws';
  let s;try{s=new WebSocket(url);}catch(_){setTimeout(wsConnect,3000);return;}
  setStatus(false,'인식 프로그램 연결 중…');
  s.onopen=()=>{ws=s;partialBusy=false;};
  s.onclose=()=>{if(ws===s)ws=null;setStatus(false,'인식 프로그램 연결 끊김 · 다시 연결 중');setTimeout(wsConnect,2500);};
  s.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(_){return;}
    if(m.type==='hello'){wsInfo=`${m.engine} · ${String(m.model).split('/').pop()}`;setStatus(true,`Whisper 오프라인 인식 · ${wsInfo}`);return;}
    const u=utts[m.id];
    if(m.type==='partial'){partialBusy=false;if(u&&!u.done&&m.text&&(m.id===vad.id||!vad.on))setPartial(m.text);return;}
    if(m.type==='final'&&u){u.done=true;
      const list=m.words&&m.words.length?m.words.map(w=>({w:w.w,a:u.t0+w.start,b:u.t0+w.end})):(m.text?[{w:m.text,a:u.t0,b:u.t1}]:[]);
      if(list.length)onWords(list,u.sp);if(!vad.on)setPartial('');}
  };
}
function vadStep(f){
  const voiced=f.v>.08;if(voiced){vad.run++;vad.lastVoice=f.t;}else vad.run=0;
  if(!vad.on&&vad.run>=4){vad.on=true;vad.id++;vad.t0=Math.max(f.t-.35,vad.lastClose||0);vad.lastPartial=f.t;utts[vad.id]={t0:vad.t0,sp:speaker,closed:false,done:false};}
  if(vad.on){const long=f.t-vad.t0>14;
    if(f.t-vad.lastVoice>.7||long)closeUtt(long?f.t:Math.min(f.t,vad.lastVoice+.3));
    else if(f.t-vad.lastPartial>1&&!partialBusy){vad.lastPartial=f.t;sendUtt(vad.id,vad.t0,f.t,true);}}
}
function closeUtt(t1){if(!vad.on)return;vad.on=false;vad.lastClose=t1;const u=utts[vad.id];u.t1=t1;u.closed=true;u.sent=now();if(t1-u.t0<.3){u.done=true;return;}sendUtt(vad.id,u.t0,t1,false);}
function sendUtt(id,t0,t1,partial){if(!ws||ws.readyState!==1)return;if(partial)partialBusy=true;ws.send(JSON.stringify({type:'utt',id,partial,lang:CFG.lang,pcm:pcmBetween(t0,t1)}));}
function setStatus(ok,txt){$('sDot').classList.toggle('ok',ok);$('sTxt').textContent=txt;}

/* =========================================================================
   3. 나선 좌표
   ========================================================================= */
const TURN=8,R=330,TURN_H=240,SEMI=5,ARC=2*Math.PI*R/TURN;
const ang=t=>Math.PI/2+.85-t/TURN*2*Math.PI;
const base=t=>-t/TURN*TURN_H;
const pitchY=hz=>12*Math.log2(hz/170)*SEMI;
const P=(t,r,y)=>{const a=ang(t);return[r*Math.cos(a),y,r*Math.sin(a)];};

const gc=document.createElement('canvas');gc.width=gc.height=220;const gx=gc.getContext('2d',{willReadFrequently:true});const gCache=new Map();
function glyphLines(ch,wt,lines,vertical){ // 글자를 래스터로 그린 뒤 한 줄씩 훑어 선분으로
  const key=ch+wt+lines+vertical;if(gCache.has(key))return gCache.get(key);
  gx.clearRect(0,0,220,220);gx.fillStyle='#000';gx.textAlign='center';gx.textBaseline='middle';gx.font=`${wt} 170px ${SANS}`;gx.fillText(ch,110,118);
  const d=gx.getImageData(0,0,220,220).data,on=(x,y)=>d[(y*220+x)*4+3]>110;
  let x0=220,y0=220,x1=0,y1=0;for(let y=0;y<220;y++)for(let x=0;x<220;x++)if(on(x,y)){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  const segs=[];if(x1<=x0){const r={segs,aspect:1};gCache.set(key,r);return r;}
  const bw=x1-x0+1,bh=y1-y0+1;
  if(!vertical){for(let r=0;r<lines;r++){const y=Math.round(y0+(r+.5)/lines*bh);let s=-1;for(let x=x0;x<=x1+1;x++){const v=x<=x1&&on(x,y);if(v&&s<0)s=x;if(!v&&s>=0){segs.push([(s-x0)/bw-.5,.5-(y-y0)/bh,(x-x0)/bw-.5,.5-(y-y0)/bh]);s=-1;}}}}
  else{for(let c=0;c<lines;c++){const x=Math.round(x0+(c+.5)/lines*bw);let s=-1;for(let y=y0;y<=y1+1;y++){const v=y<=y1&&on(x,y);if(v&&s<0)s=y;if(!v&&s>=0){segs.push([(x-x0)/bw-.5,.5-(s-y0)/bh,(x-x0)/bw-.5,.5-(y-y0)/bh]);s=-1;}}}}
  if(gCache.size>4000)gCache.clear();const r={segs,aspect:bw/bh};gCache.set(key,r);return r;
}

/* =========================================================================
   4. THREE 장면
   ========================================================================= */
let renderer,scene,camera,fog,scaf,sessG,glyphG,dataG,cursorG;
const mats=new Set(),sprites=new Set();
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function mat(op,dashed){const m=dashed?new THREE.LineDashedMaterial({color:0xffffff,transparent:true,opacity:op,dashSize:dashed[0],gapSize:dashed[1],depthWrite:false})
  :new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:op,depthWrite:false});m.userData.op=op;styleMat(m);mats.add(m);return m;}
function styleMat(m){if(!renderer)return;m.color.set(css('--fg'));m.blending=document.documentElement.classList.contains('inv')?THREE.NormalBlending:THREE.AdditiveBlending;m.needsUpdate=true;}
function geo(arr){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));return g;}
function segObj(arr,m){const o=new THREE.LineSegments(geo(arr),m);if(m.isLineDashedMaterial)o.computeLineDistances();return o;}
function lineObj(arr,m){const o=new THREE.Line(geo(arr),m);if(m.isLineDashedMaterial)o.computeLineDistances();return o;}
function preLine(n,m,seg){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));g.setDrawRange(0,0);const o=seg?new THREE.LineSegments(g,m):new THREE.Line(g,m);o.frustumCulled=false;return o;}
function label(lines,opt={}){
  const c=document.createElement('canvas'),x=c.getContext('2d'),px=opt.px||20,PAD=6;
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true,depthWrite:false,opacity:opt.op??1}));spr.center.set(opt.ax??0,opt.ay??.5);
  spr.userData.lines=lines;
  spr.userData.draw=()=>{const L=spr.userData.lines;

function onWords(list,sp){

function bindMouse(cv){
  const ptr=new Map();let pinch=0,mode='rot';
  addEventListener('pointermove',showCursor);
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);mode=(e.button===2||e.shiftKey)?'pan':'rot';
    if(ptr.size===2){const[a,b]=[...ptr.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);}});
  cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);
    if(!dx&&!dy)return;touchUser();
    if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)goal.dist=clamp(goal.dist*pinch/d,400,30000);pinch=d;}
    else if(mode==='pan')goal.ty+=dy*goal.dist*.0011;
    else{goal.theta-=dx*.006;goal.phi=clamp(goal.phi-dy*.005,.06,2.9);}});
  const up=e=>{ptr.delete(e.pointerId);pinch=0;};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('wheel',e=>{e.preventDefault();touchUser();goal.dist=clamp(goal.dist*(1+e.deltaY*.0012),400,30000);},{passive:false});

}

  const s=Math.sin(cam.phi);camera.position.set(cam.dist*s*Math.sin(cam.theta),cam.ty+cam.dist*Math.cos(cam.phi),cam.dist*s*Math.cos(cam.theta));

let lastTs=0,hudT=0;

    for(const f of framesIn(envLine.userData.last+1e-6,tn)){if(n>=pos.count)break;const t=sessT(f.t);if(t<0)continue;const p=P(t,R-26,base(t)-86+f.v*52);pos.setXYZ(n++,p[0],p[1],p[2]);envLine.userData.last=f.t;}
    envLine.userData.n=n;pos.needsUpdate=true;envLine.geometry.setDrawRange(0,n);
    railLine.geometry.setDrawRange(0,Math.floor(nt/.05)+1);tickSegs.geometry.setDrawRange(0,2*(Math.floor(nt/.5)+1));
    while(tickLabelT<=nt){if(tickLabelT>0){const l=label([`${String(tickLabelT).padStart(2,'0')} s`],{px:20,scale:.24,ax:.5,op:.7});l.position.set(...P(tickLabelT,R-26,base(tickLabelT)-108));dataG.add(l);}tickLabelT+=2;}
    while(turnLabelK*TURN<=nt){const t=turnLabelK*TURN,y=base(t);const l=label([`${fmt(t).slice(0,5)}–${fmt(t+TURN).slice(0,5)}`],{px:20,scale:.25,op:.75});l.position.set(12,y-14,0);dataG.add(l);
      dataG.add(segObj([0,y,0,...P(t,R-40,y)],mat(.16,[2,6])));turnLabelK++;}
    // 커서
    const a=ang(nt),y=base(nt),c=cursorG.children;
    c[0].geometry.attributes.position.array.set([0,y,0,(R+200)*Math.cos(a),y,(R+200)*Math.sin(a)]);c[0].geometry.attributes.position.needsUpdate=true;
    c[1].geometry.attributes.position.array.set([R*Math.cos(a),y-110,R*Math.sin(a),R*Math.cos(a),y+120,R*Math.sin(a)]);c[1].geometry.attributes.position.needsUpdate=true;c[1].computeLineDistances();
    if(partialSpr)partialSpr.position.set((R+210)*Math.cos(a),y+10,(R+210)*Math.sin(a));
    // 카메라: 지금 쓰이는 자리가 늘 앞을 보도록 나선을 따라 돎
    // 카메라는 방금 새겨진 단어를 정면에 둠. 말이 멈춘 동안에는 그 자리에 머물고, 새 단어가 새겨지면 따라감
    const focus=S.lastEnd!=null?S.lastEnd-.4:nt-.8;
    if(!userCam()){goal.theta=Math.PI/2-ang(focus);goal.phi=1.32;goal.dist=fitDist(1650);goal.ty=base(focus)+120;}
    floorG.position.y=y-320;
    if(S.snap){Object.assign(cam,goal);S.snap=false;}  // 세션 시작 때는 바로 그 자리로
    if(S.stopping){if(!awaiting()||tn-S.stopAt>8)endSession();}     // 2번: 남은 인식 결과를 받은 뒤 저장
    else if(CFG.idle>0&&tn-S.lastVoice>CFG.idle&&!awaiting()&&!vad.on)endSession();
    else if(nt>CFG.maxSess)requestStop();
  }else{
    const auto=!userCam();if(auto){goal.theta+=dt*.07;goal.phi=1.25;}
    if(S.dur>0){const H=S.dur/TURN*TURN_H+460;if(auto){goal.dist=fitDist(Math.max(2150,H/2/Math.tan(16*Math.PI/180)*1.08));goal.ty=base(S.dur/2)-40;}floorG.position.y=base(S.dur)-320;}
    else{if(auto){goal.dist=fitDist(2050);goal.ty=0;}floorG.position.y=-320;}
  }
  // 글자가 선으로 그려지는 애니메이션
  reveals=reveals.filter(r=>{const f=clamp((tn-r.born-r.delay)/.7,0,1);r.o.geometry.setDrawRange(0,2*Math.floor(f*r.n/2));return f<1;});
  fades=fades.filter(f=>{const k=clamp((tn-f.born-.5)/.5,0,1);f.spr.material.opacity=k;f.leader.visible=k>0;return k<1;});
  // 중심축
  const top=(S.state==='idle'&&!S.words.length)?260:220,bot=floorG.position.y;
  axisObj.geometry.attributes.position.array.set([0,top,0,0,bot,0]);axisObj.geometry.attributes.position.needsUpdate=true;
  applyCam(false);renderer.render(scene,camera);
  if(ts-hudT>100){hudT=ts;hud();}
  requestAnimationFrame(frame);
}
function hud(){
  const rec=S.state==='active';$('kStart').classList.toggle('on',!rec);$('kStop').classList.toggle('on',rec&&!S.stopping);
  if(S.state==='active'){$('rT').textContent=fmt(S.dur);$('sess').textContent=`세션 ${String(sessCount).padStart(3,'0')} · ${S.stopping?'저장 중':'기록 중'} · ${S.words.length}단어`;}
  else{$('rT').textContent='';$('rW').textContent='';$('rV').textContent='';$('sess').textContent=S.words.length?`지난 세션 ${String(sessCount).padStart(3,'0')} · ${S.words.length}단어 · ${fmt(S.dur)}`:'대기 중';}
  if(!$('help').hidden)$('cal').textContent=`입력 ${Math.round(lv.db)} dB · 소음 ${Math.round(lv.floor)} · 큰 소리 ${Math.round(lv.peak)} · 자동 종료 ${CFG.idle?CFG.idle+'초':'끔'} · ${CFG.demo?'데모':wsInfo||'인식 연결 대기'}`;
}

/* =========================================================================
   8. 시작
   ========================================================================= */
async function boot(){
  if(!window.THREE){$('prompt').hidden=false;$('pBig').textContent='3D 라이브러리를 찾을 수 없습니다';$('pSmall').textContent='vendor/three.min.js 파일이 이 페이지와 같은 폴더에 있는지 확인해 주세요';return;}
  if(CFG.invert)document.documentElement.classList.add('inv');
  renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.setSize(innerWidth,innerHeight,false);
  camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,10,20000);
  scene=new THREE.Scene();fog=new THREE.Fog(0,1,2);scene.fog=fog;
  sessG=new THREE.Group();cursorG=new THREE.Group();scene.add(sessG,cursorG);cursorG.visible=false;
  cursorG.add(preLine(2,mat(.9),true));cursorG.children[0].geometry.setDrawRange(0,2);
  cursorG.add(preLine(2,mat(.9,[3,4]),true));cursorG.children[1].geometry.setDrawRange(0,2);
  buildScaffold();mats.forEach(styleMat);applyTheme();
  addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
  addEventListener('keydown',e=>{const k=e.key.toLowerCase();
    if(k==='h'){$('help').hidden=!$('help').hidden;document.body.classList.toggle('cursor',!$('help').hidden);hud();}
    else if(k==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}
    else if(k==='i'){document.documentElement.classList.toggle('inv');applyTheme();}
    else if(k==='d'){CFG.data=!CFG.data;if(dataG)dataG.visible=CFG.data;scaf.visible=CFG.data;}
    else if(k==='1')startRecording();else if(k==='2')requestStop();
    else if(k==='a')speaker='A';else if(k==='b')speaker='B';});
  bindMouse($('gl'));
  scaf.visible=CFG.data;
  if(CFG.demo){setStatus(true,'데모 모드 · 예시 대사');}
  else{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('prompt').hidden=false;$('pBig').textContent='이 브라우저에서는 마이크를 쓸 수 없습니다';$('pSmall').textContent='start_installation.command 로 실행해 주세요';}
    else try{await startMic();wsConnect();}
    catch(e){$('prompt').hidden=false;$('pBig').textContent='마이크를 열 수 없습니다';$('pSmall').textContent=`마이크 연결과 Chrome의 마이크 허용을 확인해 주세요 (${e.name||e.message})`;}
  }
  requestAnimationFrame(frame);
}
boot();
window.__mereh={get S(){return S;},endSession};
</script>
